# Step 2 - OAuth credentials for the Dynatrace Operator (TEMPLATE ONLY).
#
# DO NOT put real values in this file and DO NOT commit real values to Git.
# The README shows how to create the Secret without writing the secret to disk.
#
# Key names (oauth-client-id / oauth-client-secret) follow the Dynatrace docs for
# "Set up EdgeConnect for Kubernetes Connector using the Dynatrace Operator".
apiVersion: v1
kind: Secret
metadata:
  name: edgeconnect-oauth
  namespace: dynatrace # the namespace where the Dynatrace Operator runs
type: Opaque
stringData:
  oauth-client-id: "<CLIENT_ID>" # from the OAuth client you created (prefix dt0s02)
  oauth-client-secret: "<CLIENT_SECRET>" # shown only once at creation - keep it in a password manager
